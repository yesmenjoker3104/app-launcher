name: Release

on:
    push:
        tags:
            - "v*.*.*"
            - "dev-latest"
    workflow_dispatch:

jobs:
    build-windows:
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Build EXE
              shell: pwsh
              run: .\build.ps1

            - name: Archive
              shell: pwsh
              run: Compress-Archive -Path .\dist\* -DestinationPath AppLauncherCli-Windows.zip -Force

            - name: Upload Release Asset
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev-latest' }}"
                  files: AppLauncherCli-Windows.zip
                  prerelease: "${{ github.ref_name == 'dev-latest' || github.event_name == 'workflow_dispatch' }}"
                  overwrite_files: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
